[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tse-analysis"
version = "0.1.0"
description = "Base analítica reproduzível em Parquet sobre o comportamento eleitoral a partir dos dados públicos do TSE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "plotly>=5.20.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "py7zr>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "jupyter>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tse_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.ipynb" = ["E501", "F404"]

[tool.ruff.lint.isort]
known-first-party = ["tse_analysis", "tests"]
