schema_version: "1.0"
default_election_year: 2026
supported_election_years: [2022, 2024, 2026]
partition_policy:
  allowed_keys: ["election_year", "turn", "uf"]
  forbidden_keys: ["section_num", "urna_serial", "municipio_code", "raw_timestamp"]

sources:
  totalizacao_arquivos_transmitidos:
    source_id: "totalizacao_arquivos_transmitidos"
    title: "Arquivos Transmitidos para Totalização"
    ckan_dataset_slug: "resultados-{election_year}-arquivos-transmitidos-para-totalizacao"
    url_template: "https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes{election_year}/arqurnatot/bu_imgbu_logjez_rdv_vscmr_{election_year}_{turn}t_{uf}.zip"
    supported_years: [2022, 2024, 2026]
    file_format: "zip_bundle"
    inner_artifacts: [".jez", ".bu", ".rdv", ".vscmr", ".imgbu", ".pdf"]
    expected_encoding: "latin1"
    delimiter: null
    native_grain: "urna_transmission_package"
    target_table: "fact_urna_logs"
    natural_keys: ["election_year", "turn", "uf", "municipio_code", "zone_num", "section_num"]
    expected_columns: []
    filter_rules:
      situacao: "Totalizado"
    license_status: "open_documented"
    license_notes: "Licença Creative Commons Atribuição (cc-by) declarada no CKAN do TSE; considera apenas pacotes na situação Totalizado."
    redistribution_allowed: true

  ecossistema_urna_log_docs:
    source_id: "ecossistema_urna_log_docs"
    title: "Log dos Aplicativos do Ecossistema da Urna — Documentação Técnica"
    ckan_dataset_slug: "log-do-ecossistema-{election_year}"
    url_template: "https://www.tse.jus.br/eleicoes/eleicoes-{election_year}-content/arquivos/log-do-ecossistema/@@display-file/file/log-do-ecossistema.pdf"
    supported_years: [2022, 2024, 2026]
    file_format: "pdf_doc"
    inner_artifacts: [".pdf"]
    expected_encoding: "utf-8"
    delimiter: "\t"
    native_grain: "urna_log_event"
    target_table: "fact_urna_logs"
    natural_keys: ["election_year", "turn", "uf", "municipio_code", "zone_num", "section_num", "urna_serial", "file_seq"]
    expected_columns: ["raw_timestamp", "log_level", "urna_serial", "application", "message_text"]
    filter_rules: {}
    license_status: "open_documented"
    license_notes: "Documentação técnica oficial do TSE (https://www.tse.jus.br/eleicoes/eleicoes-2026-content/arquivos/log-do-ecossistema/@@display-file/file/log-do-ecossistema.pdf) e Resolução TSE nº 23.759/2026 (https://www.tse.jus.br/legislacao/compilada/res/2026/resolucao-no-23-759-de-26-de-fevereiro-de-2026)."
    redistribution_allowed: true

  resultados_boletim_urna:
    source_id: "resultados_boletim_urna"
    title: "Resultados — Boletim de Urna (BU) por UF e Turno"
    ckan_dataset_slug: "resultados-{election_year}-boletim-de-urna"
    url_template: "https://dadosabertos.tse.jus.br/api/3/action/package_show?id=resultados-{election_year}-boletim-de-urna&turn={turn}&uf={uf}"
    supported_years: [2022, 2024, 2026]
    file_format: "zip_csv"
    inner_artifacts: [".csv", ".pdf", ".sha512"]
    expected_encoding: "latin1"
    delimiter: ";"
    native_grain: "bu_section_cargo_vote"
    target_table: "fact_boletim_urna"
    natural_keys: ["election_year", "turn", "uf", "municipio_code", "zone_num", "section_num", "cargo_code", "votavel_num"]
    expected_columns:
      - "ANO_ELEICAO"
      - "NR_TURNO"
      - "SG_UF"
      - "CD_MUNICIPIO"
      - "NR_ZONA"
      - "NR_SECAO"
      - "CD_CARGO_PERGUNTA"
      - "NR_VOTAVEL"
      - "QT_VOTOS"
      - "NR_URNA_EFETIVADA"
    filter_rules:
      situacao: "Totalizado"
    license_status: "open_documented"
    license_notes: "Licença Creative Commons Atribuição (cc-by). Os arquivos físicos em https://cdn.tse.jus.br/estatistica/sead/eleicoes/eleicoes2026/buweb/bweb_{turn}t_{uf}_<DDMMYYYYHHMM>.zip possuem sufixo de timestamp de geração, sendo resolvidos via API CKAN."
    redistribution_allowed: true

  resultados_apuracao_secao:
    source_id: "resultados_apuracao_secao"
    title: "Resultados — Detalhe da Apuração e Votação por Seção Eleitoral"
    ckan_dataset_slug: "resultados-{election_year}"
    url_template: "https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_{election_year}_{uf}.zip"
    supported_years: [2022, 2024, 2026]
    file_format: "zip_csv"
    inner_artifacts: [".csv", ".pdf"]
    expected_encoding: "latin1"
    delimiter: ";"
    native_grain: "section_turn"
    target_table: "fact_votacao_secao"
    natural_keys: ["election_year", "turn", "uf", "municipio_code", "zone_num", "section_num", "cargo_code"]
    expected_columns:
      - "ANO_ELEICAO"
      - "NR_TURNO"
      - "SG_UF"
      - "CD_MUNICIPIO"
      - "NR_ZONA"
      - "NR_SECAO"
      - "CD_CARGO"
      - "NR_VOTAVEL"
      - "QT_VOTOS"
    filter_rules:
      situacao: "Totalizado"
    license_status: "open_documented"
    license_notes: "Licença Creative Commons Atribuição (cc-by). Inclui votacao_secao_{election_year}_{uf}.zip, detalhe_votacao_secao_{election_year}.zip, votacao_candidato_munzona_{election_year}.zip, votacao_partido_munzona_{election_year}.zip e detalhe_votacao_munzona_{election_year}.zip."
    redistribution_allowed: true

  eleitorado_perfil:
    source_id: "eleitorado_perfil"
    title: "Eleitorado — Perfil por Seção, Local de Votação, PCD e Transferência Temporária"
    ckan_dataset_slug: "eleitorado-{election_year}"
    url_template: "https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_eleitor_secao/perfil_eleitor_secao_{election_year}_{uf}.zip"
    supported_years: [2022, 2024, 2026]
    file_format: "zip_csv"
    inner_artifacts: [".csv", ".pdf"]
    expected_encoding: "latin1"
    delimiter: ";"
    native_grain: "municipality_zone_profile"
    target_table: "fact_eleitorado_perfil_secao"
    natural_keys: ["election_year", "uf", "municipio_code", "zone_num", "section_num", "gender_code", "age_group_code", "education_level_code"]
    expected_columns:
      - "AA_ELEICAO"
      - "SG_UF"
      - "CD_MUNICIPIO"
      - "NR_ZONA"
      - "NR_SECAO"
      - "CD_GENERO"
      - "CD_FAIXA_ETARIA"
      - "CD_GRAU_ESCOLARIDADE"
      - "QT_ELEITORES"
      - "QT_ELEITORES_BIOMETRIA"
      - "QT_ELEITORES_DEFICIENCIA"
    filter_rules: {}
    license_status: "open_documented"
    license_notes: "Licença Creative Commons Attribution (cc-by). Inclui perfil_eleitor_secao_{election_year}_{uf}.zip, perfil_eleitorado_{election_year}.zip, eleitorado_local_votacao_{election_year}.zip, perfil_eleitor_deficiencia_{election_year}.zip, transferencia_temporaria_{election_year}.zip e transf_temporaria_secao_{election_year}.zip."
    redistribution_allowed: true

  comparecimento_abstencao:
    source_id: "comparecimento_abstencao"
    title: "Comparecimento e Abstenção (Sistema ELO)"
    ckan_dataset_slug: "comparecimento-e-abstencao-{election_year}"
    url_template: "https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_comparecimento_abstencao/perfil_comparecimento_abstencao_{election_year}.zip"
    supported_years: [2022, 2024, 2026]
    file_format: "zip_csv"
    inner_artifacts: [".csv", ".pdf"]
    expected_encoding: "latin1"
    delimiter: ";"
    native_grain: "municipality_zone_profile"
    target_table: "fact_comparecimento_abstencao"
    natural_keys: ["election_year", "turn", "uf", "municipio_code", "zone_num", "gender_code", "age_group_code", "education_level_code"]
    expected_columns:
      - "ANO_ELEICAO"
      - "NR_TURNO"
      - "SG_UF"
      - "CD_MUNICIPIO"
      - "NR_ZONA"
      - "CD_GENERO"
      - "CD_FAIXA_ETARIA"
      - "CD_GRAU_INSTRUCAO"
      - "QT_APTOS"
      - "QT_COMPARECIMENTO"
      - "QT_ABSTENCAO"
    filter_rules: {}
    license_status: "open_documented"
    license_notes: "Página oficial do Portal de Dados Abertos do TSE (Sistema ELO) omite o campo license_id ('Nenhuma Licença Fornecida'), tratado por decisão de projeto como omissão formal do portal para dados públicos abertos do TSE, autorizado para incorporação 1:1 ao dataset público."
    redistribution_allowed: true

  correspondencias_esperadas_efetivadas:
    source_id: "correspondencias_esperadas_efetivadas"
    title: "Correspondências Esperadas e Efetivadas (1º e 2º Turnos por UF)"
    ckan_dataset_slug: "resultados-{election_year}-correspondencias-esperadas-e-efetivadas-{turn}-turno"
    url_template: "https://dadosabertos.tse.jus.br/api/3/action/package_show?id=resultados-{election_year}-correspondencias-esperadas-e-efetivadas-{turn}-turno&uf={uf}"
    supported_years: [2022, 2024, 2026]
    file_format: "zip_csv"
    inner_artifacts: [".csv", ".pdf", ".sha512"]
    expected_encoding: "latin1"
    delimiter: ";"
    native_grain: "urna_correspondence_turn"
    target_table: "bridge_correspondencia_efetivada"
    natural_keys: ["election_year", "turn", "uf", "municipio_code", "zone_num", "section_num", "urna_serial_expected", "urna_serial_effective"]
    expected_columns:
      - "AA_ELEICAO"
      - "SG_UF"
      - "CD_MUNICIPIO"
      - "NR_ZONA"
      - "NR_SECAO"
      - "NR_URNA_ESPERADA"
      - "NR_URNA_EFETIVADA"
      - "CD_CARGA_1_URNA_ESPERADA"
      - "CD_CARGA_1_URNA_EFETIVADA"
    filter_rules:
      situacao: "Totalizado"
    license_status: "open_documented"
    license_notes: "Licença Creative Commons Atribuição (cc-by). Os arquivos físicos em correspesp/CESP_{turn}t_{uf}_<DDMMYYYYHHMM>.zip e correspefet/CEFT_{turn}t_{uf}_<DDMMYYYYHHMM>.zip possuem sufixo de timestamp de geração, sendo resolvidos via API CKAN."
    redistribution_allowed: true
